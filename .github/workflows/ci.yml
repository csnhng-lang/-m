name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node.js (bản chính)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Cài dependency
        run: npm ci
      - name: Kiểm tra cú pháp + test
        run: npm test

  python:
    name: Python (bản thay thế)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cài dependency
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
