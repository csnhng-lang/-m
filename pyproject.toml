[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    "E501",  # độ dài dòng do formatter/line-length quyết định
    "B008",  # app_commands dùng hàm trong default an toàn
    "ARG001",# tham số callback của discord.py không dùng hết
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PTH", "S101"]
"scripts/*" = ["PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
